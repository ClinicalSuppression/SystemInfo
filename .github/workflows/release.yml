name: Build, Test, and Publish

# Tag-push CI only: verifies the tag builds, tests pass, and the portable
# framework-dependent x64 app publishes. Uploads an artifact for inspection.
# Releases are cut manually via the gh CLI (file naming, installer, notes).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_NAME: SystemInfo
  TEST_PROJECT: SystemInfo.Tests/SystemInfo.Tests.csproj
  SOLUTION_FILE: SystemInfo.slnx

jobs:
  build-test-publish:
    name: Build, Test, Publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build with warnings as errors
        run: dotnet build ${{ env.SOLUTION_FILE }} -c Release -warnaserror

      - name: Run tests
        run: dotnet run --project ${{ env.TEST_PROJECT }} -c Release --no-build

      - name: Publish executable (framework-dependent)
        run: dotnet publish ${{ env.PROJECT_NAME }}.csproj -c Release -r win-x64 --self-contained false -o publish-win-x64 -warnaserror

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemInfo-win-x64
          path: publish-win-x64/
          retention-days: 30
