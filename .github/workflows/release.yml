name: Build, Test, and Release

on:
  push:
    tags:
      - "v*.*.*"  # Triggers on semantic version tags (e.g., v1.0.0)
  workflow_dispatch:  # Allows manual trigger from GitHub UI

env:
  DOTNET_VERSION: "8.0.x"
  PROJECT_NAME: "SystemInfo"
  TEST_PROJECT: "SystemInfo.Tests\SystemInfo.Tests.csproj"
  SOLUTION_FILE: "SystemInfo.slnx"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build with warnings as errors
        run: dotnet build ${{ env.SOLUTION_FILE }} -c Release -warnaserror

      - name: Run tests
        run: dotnet test ${{ env.TEST_PROJECT }} -c Release --no-build --verbosity normal

      - name: Publish executable (framework-dependent)
        run: |
          dotnet publish ${{ env.PROJECT_NAME }}.csproj -c Release -r win-x64 --self-contained false -o publish-win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemInfo-win-x64
          path: publish-win-x64/

  create-release:
    name: Create GitHub Release
    runs-on: windows-latest
    needs: build-and-test

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SystemInfo-win-x64
          path: release-artifacts

      - name: Generate changelog
        id: generate-changelog
        run: |
          $version = $env:GITHUB_REF.Replace('refs/tags/', '')
          $changelog = Get-Content -Path CHANGELOG.md | Select-String -Pattern "^\# \[$version\]" -Context 0,30 | Select-Object -Last 1
          echo "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
          echo $changelog | ForEach-Object { echo $_ } >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/**
          generate_release_notes: true
          body_path: ${{ steps.generate-changelog.outputs.CHANGELOG }}
          tag_name: ${{ github.ref }}
